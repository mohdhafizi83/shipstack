server {
    listen 80;
    server_name _;

    # Static half: what CloudFront + S3 do in the cloud modules.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dynamic half: what the ALB + Fargate service do in the cloud modules.
    location /healthz {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
