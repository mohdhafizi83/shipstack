# Hardened local edge: mirrors what the cloud modules enforce (ALB security
# group + CloudFront response headers) at the local entry point.

# Rate limit per client IP: enough for a demo dashboard polling /healthz +
# /api/db, low enough that a script kiddie can't hammer the app container.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Don't advertise the nginx version in error pages / Server header.
    server_tokens off;

    # Cap request bodies at the edge (app enforces its own 64k webhook cap;
    # this stops oversized uploads before they reach anything).
    client_max_body_size 1m;

    # Same header set the app emits (see app/app.py SECURITY_HEADERS), with
    # `always` so they ride along on nginx-generated errors too (429 from
    # the limiter below, 413 from the body cap). In prod these are
    # CloudFront response-header-policy territory.
    #
    # HSTS: only meaningful once TLS is terminated here. In prod CloudFront
    # terminates TLS and sets Strict-Transport-Security via its response
    # header policy, so it stays commented locally.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static half: what CloudFront + S3 do in the cloud modules.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dynamic half: what the ALB + Fargate service do in the cloud modules.
    # The app already sets the security headers; hide them on the way
    # through so the server-level add_header above replaces them instead of
    # duplicating them (nginx add_header would otherwise stack).
    location /healthz {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }
}
