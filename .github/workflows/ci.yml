name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt / validate / plan / checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9.0"
          terraform_wrapper: false

      # fmt and validate run across the whole repo, not just the example.
      - name: terraform fmt -check
        run: |
          cd "$GITHUB_WORKSPACE"
          terraform fmt -check -recursive

      - name: terraform init (modules)
        run: terraform init -input=false -backend=false

      - name: terraform validate (modules + example)
        run: |
          terraform validate
          cd "$GITHUB_WORKSPACE"
          for d in modules/*/; do
            echo "::group::validate $d"
            (cd "$d" && terraform init -input=false -backend=false && terraform validate)
            echo "::endgroup::"
          done

      # The plan is the test: it must succeed with FAKE credentials because no
      # module uses a plan-time data source that calls AWS APIs. The provider
      # flags come from var.ci_plan_mode (default true in this example).
      - name: terraform plan (no real credentials)
        env:
          AWS_ACCESS_KEY_ID: mock_access_key_id
          AWS_SECRET_ACCESS_KEY: mock_secret_access_key
          AWS_DEFAULT_REGION: us-east-1
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Plan summary
        run: terraform show -no-color tfplan | tail -n 5

      - name: Checkov IaC scan (fail on HIGH)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: "true"
          soft_fail_on: LOW,MEDIUM
          hard_fail_on: HIGH
